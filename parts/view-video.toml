[view.video]
name = { en = "Video", pt_BR = "Com vídeo" }

[[view.video.systems.el]]
id = "help"
kind = "hints"
rect = { h = "$help_rect_h", w = 0.96833, x = 0.01667, y = "$help_rect_y" }
align = "left"
badge = "$primaryColor"
color = "$primaryColorLightVariant"
z = 995

[[view.video.systems.el]]
id = "borderoverlay"
kind = "image"
src = ["$borderoverlay_src_0", "assets/ratio32/borders.png"]
rect = { h = 1.0, w = 1.0, x = 0.0, y = 0.0 }
fit = "stretch"
z = 400

[[view.video.systems.el]]
id = "help-system-background"
kind = "image"
src = ["$help-system-background_src_0", "assets/ratio32/help-system-bg.png"]
rect = { h = 1.0, w = 1.0, x = 0.0, y = 0.0 }
fit = "stretch"
z = 360

[[view.video.systems.el]]
id = "backgroundscanlines"
kind = "frame"
rect = { h = 1.0, w = 1.0, x = 0.0, y = 0.0 }
enter = { duration = 0.3, fade = false, scale = 1.1 }
image = "$backgroundscanlines_image"
opacity = "$backgroundscanlines_opacity"
slice = 0
tile = true
z = 0

[[view.video.systems.el]]
id = "systemcarousel"
kind = "carousel"
of = "systems"
axis = "vertical"
visible = 5
rect = { h = 1.3, w = 0.33333, x = 0.0, y = 0.0 }
item = { color = "$primaryColorAlt", font = "assets/fonts/FiraSansCondensed/FiraSansCondensed-Medium.ttf", h = 1.0, image = "system.logo", size = "$systemcarousel_item_size", text = "${item.name}", w = 0.2 }
loop = true
opacity = 0.5
selected = { opacity = 1.0, scale = 1.375 }
wheel = { angle = 5.0, pivot = ["$systemcarousel_wheel_pivot_0", 0.5] }
z = 160

[[view.video.systems.el]]
id = "systemname"
kind = "text"
text = "${system.name}"
rect = { h = "$systemname_rect_h", w = 0.6125, x = 0.34375, y = 0.05 }
color = "#FFFFFFFF"
enter = { distance = 0.02, duration = 0.3, from = "left" }
font = "assets/fonts/Teko/Teko-SemiBold.ttf"
pivot = [0.0, 0.5]
rotate = 90.0
size = "$systemname_size"
upper = true
when = { aspect = ["classic"] }
z = 40

[[view.video.systems.el]]
id = "systemname-square"
kind = "text"
text = "${system.name}"
rect = { h = "$systemname_rect_h", w = 0.6125, x = 0.34375, y = 0.05 }
color = "#FFFFFFFF"
enter = { distance = 0.02, duration = 0.3, from = "left" }
font = "assets/fonts/Teko/Teko-SemiBold.ttf"
pivot = [0.0, 0.5]
rotate = 90.0
size = "$systemname_size"
upper = true
when = { aspect = ["square"] }
z = 40

[[view.video.systems.el]]
id = "systemname-wide"
kind = "text"
text = "${system.name}"
rect = { h = "$systemname_rect_h_2", w = 0.48, x = 0.34375, y = 0.05 }
color = "#FFFFFFFF"
enter = { distance = 0.02, duration = 0.3, from = "left" }
font = "assets/fonts/Teko/Teko-SemiBold.ttf"
pivot = [0.0, 0.5]
rotate = 90.0
size = "$systemname_size_2"
upper = true
when = { aspect = ["wide"] }
z = 40

[[view.video.systems.el]]
id = "systeminfo"
kind = "text"
text = "${system.games}"
rect = { h = "$systeminfo_rect_h", w = "$systeminfo_rect_w", x = 0.3875, y = 0.05 }
color = "#FFFFFFCC"
enter = { duration = 0.6 }
font = "assets/fonts/Teko/Teko-Medium.ttf"
pivot = [0.0, 0.5]
rotate = 90.0
size = "$systeminfo_size"
upper = true
z = 40

[[view.video.systems.el]]
id = "cover-fallback"
kind = "frame"
rect = { h = 1.0, w = 1.0, x = 0.0, y = 0.0 }
image = "assets/background.png"
tint = "#121212FF"
slice = 0
tile = true
z = -44

[[view.video.systems.el]]
id = "cover"
kind = "image"
src = ["$cover_src_0", "$cover_src_1", "$cover_src_2", "$cover_src_3", "assets/systems/${system}.webp"]
rect = { h = 1.0, w = "$cover_rect_w", x = 0.71667, y = 0.5 }
anchor = "center"
enter = { distance = 0.03333, duration = 0.5, from = "left" }
fit = "$cover_fit"
when = { aspect = ["classic"] }
z = -40

