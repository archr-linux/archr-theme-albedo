# Detalhes: a tela de jogos com a capa, a ficha e os botões no lugar da lista.
[view.video.details]
base = "games"
remove = ["gamelist"]

[[view.video.details.el]]
id = "md-description"
long_text = "scroll"

[[view.video.details.el]]
id = "fundo-ficha"
kind = "rect"
rect = { h = 0.801, w = 0.40733, x = 0.013, y = 0.137 }
fill = "#00000099"
radius = 0.012
z = 899

[[view.video.details.el]]
id = "capa"
kind = "image"
src = ["game.cover", "game.screenshot"]
rect = { h = 0.3875, w = 0.38133, x = 0.026, y = 0.15 }
radius = 0.01
z = 900

[[view.video.details.el]]
id = "ficha"
kind = "fields"
rows = [
  { label = "@genre", value = "${game.genre}" },
  { label = "@players", value = "${game.players}" },
  { label = "@developer", value = "${game.developer}" },
  { label = "@last_played", value = "${game.last_played}" },
]
rect = { h = 0.248, w = 0.38133, x = 0.026, y = 0.56075 }
size = 0.03187
upper_labels = true
z = 900
font = "assets/fonts/FiraSansCondensed/FiraSansCondensed-Medium.ttf"
color = "#EBF5FFFF"
label_color = "#72ACEDFF"

[[view.video.details.el]]
id = "botoes"
kind = "actions"
rect = { h = 0.075, w = 0.38133, x = 0.026, y = 0.832 }
z = 900
