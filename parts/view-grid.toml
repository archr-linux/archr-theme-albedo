rect = { h = 0.625, w = 0.86667, x = 0.06667, y = 0.25 }
enter = { distance = 0.05, duration = 0.3, from = "bottom" }
item = { fit = "$gamegrid_item_fit", font = "assets/fonts/FiraSansCondensed/FiraSansCondensed-Medium.ttf", image = ["game.screenshot", "game.cover", "$gamegrid_item_image_2"], logo = "game.logo", radius = 0.0, size = "$md-description_size" }
loop = false
selected = { frame = { color = "$primaryColorAlt", radius = 0.012, width = "$gamegrid_selected_frame_width" }, opacity = 1.0, scale = 1.075 }
spacing = 0.05
z = 80

