# Detalhes: a tela de jogos com a capa, a ficha e os botões no lugar da lista.
[view.grid.details]
base = "games"
remove = ["gamegrid"]

[[view.grid.details.el]]
id = "fundo-ficha"
kind = "rect"
rect = { h = 0.655, w = 0.83667, x = 0.08167, y = 0.235 }
fill = "#00000099"
radius = 0.012
z = 899

[[view.grid.details.el]]
id = "capa"
kind = "image"
src = ["game.cover", "game.screenshot"]
rect = { h = 0.3125, w = 0.80667, x = 0.09667, y = 0.25 }
radius = 0.01
z = 900

[[view.grid.details.el]]
id = "ficha"
kind = "fields"
rows = [
  { label = "@genre", value = "${game.genre}" },
  { label = "@players", value = "${game.players}" },
  { label = "@developer", value = "${game.developer}" },
  { label = "@last_played", value = "${game.last_played}" },
]
rect = { h = 0.2, w = 0.80667, x = 0.09667, y = 0.58125 }
size = 0.02975
upper_labels = true
z = 900

[[view.grid.details.el]]
id = "botoes"
kind = "actions"
rect = { h = 0.0625, w = 0.80667, x = 0.09667, y = 0.8 }
z = 900
